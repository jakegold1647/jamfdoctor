[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jamfdoctor"
version = "0.1.0"
description = "Local, deterministic, evidence-first diagnostics for Jamf Pro policy logs and policy exports."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Jacob Goldstein"}]
keywords = ["jamf", "jamf-pro", "macos", "mdm", "diagnostics", "troubleshooting", "it-support"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
jamfdoctor = "jamfdoctor.cli:main"

[project.urls]
Repository = "https://github.com/jakegold1647/jamfdoctor"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jamfdoctor = ["demo/*.log", "demo/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
